name: Run Market Analysis and ATM Strategy Dashboard

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - .github/workflows/run-script.yml
      - TG_Alert/test/notify.py
      - TG_Alert/test/strategy_engine.py

  schedule:
    # GitHub Actions scheduled workflows have a 5-minute minimum interval.
    - cron: "20-55/5 9 * * 1-5"
      timezone: "Asia/Kolkata"

    - cron: "*/5 10-14 * * 1-5"
      timezone: "Asia/Kolkata"

    - cron: "0-15/5 15 * * 1-5"
      timezone: "Asia/Kolkata"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-dashboard
  cancel-in-progress: false

jobs:
  run-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas pyotp fyers-apiv3

      - name: Run market analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_ID: ${{ secrets.FYERS_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_SECRET: ${{ secrets.FYERS_TOTP_SECRET }}
          STRATEGY_ACCOUNT_SIZE: ${{ secrets.STRATEGY_ACCOUNT_SIZE }}

        run: python TG_Alert/test/notify.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dashboard/data/latest.json
          git add dashboard/data/history/index.json
          git add dashboard/data/snapshots/
          git add dashboard/data/strategy-state.json
          git add dashboard/data/strategy-log.jsonl

          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
          else
            git commit -m "Update market dashboard data"
            git push
          fi

      - name: Upload dashboard for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4