name: Run Market Analysis Script and Notify

on:
  workflow_dispatch:
  # Optional: You can also schedule it automatically (e.g., every weekday at 8:30 AM IST before market opens)
  # schedule:
  #   - cron: '30 3 * * 1-5'

jobs:
  run-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests yfinance pandas

      - name: Run my python script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python TG_Alert/test/notify.py
