name: Run Market Analysis Script and Notify

on:
  workflow_dispatch:
  # Optional: uncomment to run automatically on weekdays (times are UTC).
  # 09:45 IST = 04:15 UTC, 13:00 IST = 07:30 UTC
  # schedule:
  #   - cron: '15 4 * * 1-5'
  #   - cron: '30 7 * * 1-5'

jobs:
  run-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests yfinance pandas pyotp fyers-apiv3

      - name: Run my python script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_ID: ${{ secrets.FYERS_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_SECRET: ${{ secrets.FYERS_TOTP_SECRET }}
        run: python TG_Alert/test/notify.py