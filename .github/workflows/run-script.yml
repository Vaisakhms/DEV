name: Run Market Analysis and ATM Strategy Dashboard

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - dashboard/data/**

  schedule:
    # GitHub Actions schedule cron expressions use UTC.
    # Morning global market perspective: 8:30 AM IST, Monday-Friday.
    - cron: "0 3 * * 1-5"

    # Market session: 9:15 AM to 9:55 AM IST, every 5 minutes.
    - cron: "45-59/5 3 * * 1-5"
    - cron: "0-25/5 4 * * 1-5"

    # Market session: 10:00 AM to 2:55 PM IST, every 5 minutes.
    - cron: "30-55/5 4 * * 1-5"
    - cron: "*/5 5-8 * * 1-5"
    - cron: "0-25/5 9 * * 1-5"

    # Final update at 3:00 PM IST.
    - cron: "30 9 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-dashboard
  cancel-in-progress: false

jobs:
  run-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check NSE F&O trading calendar
        id: nse-calendar
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.request
          from zoneinfo import ZoneInfo

          url = "https://www.nseindia.com/api/holiday-master?type=trading"
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              calendar = json.load(response)
          holidays = calendar.get("FO")
          if not isinstance(holidays, list):
              raise ValueError("NSE F&O holiday calendar is missing.")

          today = datetime.datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).strftime("%d-%b-%Y")
          is_trading_day = not any(
              item.get("tradingDate") == today for item in holidays
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("is_trading_day=%s\n" % str(is_trading_day).lower())
          print("NSE F&O trading day: %s" % is_trading_day)
          PY

      - name: Install dependencies
        if: steps.nse-calendar.outputs.is_trading_day == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas pyotp fyers-apiv3

      - name: Run market analysis
        if: steps.nse-calendar.outputs.is_trading_day == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_ID: ${{ secrets.FYERS_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_SECRET: ${{ secrets.FYERS_TOTP_SECRET }}
          STRATEGY_ACCOUNT_SIZE: ${{ secrets.STRATEGY_ACCOUNT_SIZE }}

        run: python TG_Alert/test/notify.py

      - name: Commit dashboard data
        if: steps.nse-calendar.outputs.is_trading_day == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dashboard/data/latest.json
          git add dashboard/data/history/index.json
          git add dashboard/data/snapshots/
          git add dashboard/data/strategy-state.json
          git add dashboard/data/strategy-log.jsonl

          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
          else
            git commit -m "Update market dashboard data"
            git push
          fi

      - name: Upload dashboard for GitHub Pages
        if: steps.nse-calendar.outputs.is_trading_day == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy dashboard to GitHub Pages
        if: steps.nse-calendar.outputs.is_trading_day == 'true'
        id: deployment
        uses: actions/deploy-pages@v4